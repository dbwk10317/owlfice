<div class="ow" style="width: 1280px; height: 800px; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; position: relative; overflow: hidden">
  <div style="position: absolute; top: 24px; left: 28px; display: flex; align-items: center; gap: 10px">

    <button class="opt">
