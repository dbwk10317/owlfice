<style>
body{margin:0}
*{box-sizing:border-box}

.px{image-rendering:pixelated;display:block}

.ib{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;color:#52525B;flex:none}

.seg{display:inline-flex;align-items:center;height:32px;padding:2px;border-radius:9px;background:#F4F4F5;gap:2px}
.seg .ib{width:28px;height:28px;border-radius:7px}
.seg .ib.on{background:#fff;color:#18181B;box-shadow:0 1px 2px rgba(24,24,27,.08),0 0 0 1px rgba(24,24,27,.04)}
.tr{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.mut{color:#71717A}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:6px;font-size:12px;font-weight:500;background:#F4F4F5;color:#3F3F46;white-space:nowrap;flex:none}
.chip.line{background:#fff;border:1px solid #E4E4E7}
.stage{background-color:#F3F3F0;background-image:radial-gradient(#D9D8D3 1px,transparent 1.3px);background-size:16px 16px;position:relative}

.floor{position:absolute;left:50%;top:50%;width:min(760px,90%);height:260px;transform:translate(-50%,-30%);border-radius:50%;background:radial-gradient(ellipse at center,rgba(24,24,27,.14),rgba(24,24,27,0) 70%);filter:blur(14px);pointer-events:none}
.sd{width:14px;height:14px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none}
.sd>i{width:8px;height:8px;border-radius:50%;display:block;background:#A1A1AA}
.lbl{font-size:11px;font-weight:600;color:#71717A;letter-spacing:.02em;text-transform:uppercase}
.ow .grp{display:flex;align-items:center;gap:7px;width:100%;height:32px;padding:0 10px;border-radius:8px;font-size:12px;color:#52525B}
.grp:hover{background:#F4F4F5}
.cnt{margin-left:auto;font-size:11px;color:#71717A;font-family:'IBM Plex Mono',monospace}
.kpi{display:flex;gap:1px;background:#E4E4E7;border:1px solid #E4E4E7;border-radius:10px;overflow:hidden}
.kpi>div{flex:1;background:#fff;padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi .v{font-size:16px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi .kl{font-size:11px;color:#71717A;white-space:nowrap}
