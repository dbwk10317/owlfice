<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#18181B}a:hover{color:#52525B}
.ow{font-family:'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;color:#18181B;-webkit-font-smoothing:antialiased;font-size:13px;line-height:1.45}
.ow button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left}
.mono{font-family:'IBM Plex Mono',Consolas,monospace}
.px{image-rendering:pixelated;display:block}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.xs{width:12px;height:12px}
.ib{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;color:#52525B;flex:none}
.ib:hover{background:#F4F4F5;color:#18181B}
.tr{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.mut{color:#71717A}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:6px;font-size:12px;font-weight:500;background:#F4F4F5;color:#3F3F46;white-space:nowrap;flex:none}
.chip.live{background:#ECFDF3;color:#166534}
.stage{background-color:#F3F3F0;background-image:radial-gradient(#D9D8D3 1px,transparent 1.3px);background-size:16px 16px;position:relative}
.stage:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 55%,transparent 40%,rgba(243,243,240,.9) 100%);pointer-events:none}
.floor{position:absolute;left:50%;top:50%;width:380px;height:130px;transform:translate(-50%,-30%);border-radius:50%;background:radial-gradient(ellipse at center,rgba(24,24,27,.14),rgba(24,24,27,0) 70%);filter:blur(14px);pointer-events:none}
.sd{width:14px;height:14px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none}
.sd>i{width:8px;height:8px;border-radius:50%;display:block}
.g{background:#16A34A}.y{background:#CA8A04}.r{background:#DC2626}.k{background:#A1A1AA}
.rail{width:48px;background:#FAFAFA;border:1px solid #E4E4E7;border-radius:12px;display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:6px;flex:none}
.rail .it{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;position:relative}
.rail .it i{position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:50%;border:2px solid #FAFAFA}
.rail .it.on{box-shadow:0 0 0 2px #FAFAFA,0 0 0 3.5px #18181B}
.bub{position:absolute;background:#fff;border:2px solid #2A1E1A;padding:1px 6px 2px;font-size:11px;font-weight:600;line-height:15px;color:#2A1E1A;white-space:nowrap;box-shadow:2px 2px 0 rgba(42,30,26,.2)}
.bub.est{border-style:dashed}
.bub svg{position:absolute;left:8px;bottom:-8px;width:8px;height:7px;overflow:visible}
.room{position:absolute;transform:translate(-50%,-50%);background:rgba(255,255,255,.82);backdrop-filter:blur(4px);border:1px solid rgba(24,24,27,.08);border-radius:999px;padding:1px 8px;font-size:11px;font-weight:500;color:#3F3F46;white-space:nowrap;box-shadow:0 1px 2px rgba(24,24,27,.06)}
</style>
