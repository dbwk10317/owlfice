[package]
name = "owlfice"
version = "0.1.1"
description = "AI 에이전트 세션을 픽셀아트 사무실로 보여주는 앱"
edition = "2024"
# 검증한 툴체인. 더 낮은 버전은 확인하지 않았다
rust-version = "1.99"
publish = false
default-run = "owlfice"

[lib]
# bin(owlfice)과 이름이 같으면 Windows에서 산출물이 충돌한다 (rust-lang/cargo#8519)
name = "owlfice_lib"

[[bin]]
name = "owlfice"
path = "src/main.rs"

[[bin]]
name = "owlfice-probe"
path = "src/bin/probe.rs"

[[bin]]
name = "owlfice-replay"
path = "src/bin/replay.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
# 파일 ID(교체 감지)와 pid 생존 확인. std의 file_index()는 아직 unstable이다
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }
ts-rs = { version = "12.0.1", features = ["chrono-impl"] }
tauri-plugin-notification = "2"

[dev-dependencies]
tempfile = "3"

# https://v2.tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# 시작 작업 패닉을 오류 단계로 복구하기 위함
panic = "unwind"
strip = true
